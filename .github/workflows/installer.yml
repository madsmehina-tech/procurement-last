name: installer
# Tests the installer's logic (Linux), builds PO_Setup.exe (Windows) and runs the REAL installation end to end on a Windows machine
# (real Python / Access driver / Tesseract / share / firewall / migrate / server), then the acceptance check on the fresh installation.
on:
  push:
    paths: ["installer/**", ".github/workflows/installer.yml", "po_web/**", "po_web_v*.zip"]
  workflow_dispatch:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest Flask==3.1.3 Werkzeug==3.1.9 openpyxl python-docx
      - run: python -m pytest installer/tests -q -p no:cacheprovider

  build:
    needs: logic
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Pick the newest program package and fingerprint it
        shell: pwsh
        run: |
          $zip = Get-ChildItem po_web_v*.zip | Sort-Object { [version](($_.BaseName -replace 'po_web_v','') -replace '_','.') } -Descending | Select-Object -First 1
          Write-Host "package: $($zip.Name)"
          $h = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($zip.Name)" | Out-File -Encoding ascii "$($zip.FullName).sha256"
          "ZIP=$($zip.Name)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Host $h
      - run: pip install pyinstaller
      - name: Build PO_Setup.exe (one file, asks for administrator rights)
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --uac-admin --name PO_Setup --add-data "$env:ZIP;." --add-data "$env:ZIP.sha256;." installer\po_setup.py
      - name: The exe works (self test, no changes)
        shell: pwsh
        run: |
          Start-Process -FilePath .\dist\PO_Setup.exe -ArgumentList '--selftest','--out','selftest.txt' -Wait
          Get-Content selftest.txt
          if (-not (Select-String -Path selftest.txt -Pattern '^OK')) { exit 1 }
      - name: The wizard window really opens and works (GUI self test on the built exe)
        shell: pwsh
        run: |
          Start-Process -FilePath .\dist\PO_Setup.exe -ArgumentList '--gui-selftest','--out','gui_selftest.txt' -Wait
          Get-Content gui_selftest.txt
          if (-not (Select-String -Path gui_selftest.txt -Pattern '^OK')) { exit 1 }
      - name: Put the guide next to the exe
        shell: pwsh
        run: Copy-Item "installer\دليل_لوحة_الإدارة.md" dist\
      - uses: actions/upload-artifact@v4
        with:
          name: PO_Setup
          path: |
            dist/PO_Setup.exe
            dist/*.md

  tools:
    needs: logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: PO_import_pdfs_tool
          path: po_web/tools/import_legacy_pdfs.py
  e2e:
    needs: logic
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Answers for a full installation on this machine
        shell: pwsh
        run: |
          $zip = Get-ChildItem po_web_v*.zip | Sort-Object { [version](($_.BaseName -replace 'po_web_v','') -replace '_','.') } -Descending | Select-Object -First 1
          @{ share_folder='D:\PO_Archive'; base='D:\PO'; share_name='PO_Archive'; create_share=$true; team_group='Authenticated Users'; db_mode='new';
             admin_user='ciadmin'; admin_name='CI Admin'; admin_password='Passw0rd-CI-1'; backup_db_dir='D:\PO_Backup\db'; backup_set_dir='D:\PO_BackupSet';
             port=5000; install_tesseract=$true; open_firewall=$true; autostart=$true; start_after=$true; zip_path=$zip.FullName;
             boot_start=$true; boot_user='posvc'; boot_password='Svc-Passw0rd-CI-7' } | ConvertTo-Json | Out-File -Encoding utf8 answers.json
          # an ordinary (non-administrator) Windows account for the server to run as
          $pw = ConvertTo-SecureString 'Svc-Passw0rd-CI-7' -AsPlainText -Force
          New-LocalUser -Name posvc -Password $pw -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member posvc
      - name: Run the installer (real, silent)
        shell: pwsh
        run: python installer\po_setup.py --silent --answers answers.json
      - name: Install log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path D:\PO\install_log.txt) { Get-Content D:\PO\install_log.txt -Tail 400 }
          "--- boot task"
          Get-ScheduledTask -TaskName 'PO Web Server (Boot)' -ErrorAction SilentlyContinue | Get-ScheduledTaskInfo | Format-List LastRunTime, LastTaskResult
          (Get-ScheduledTask -TaskName 'PO Web Server (Boot)' -ErrorAction SilentlyContinue).State
          "--- server.out.txt (app\logs and logs)"
          foreach ($f in 'D:\PO\app\logs\server.out.txt','D:\PO\logs\server.out.txt') { if (Test-Path $f) { $f; Get-Content $f -Tail 40 } }
          icacls D:\PO | Select-Object -First 12
      - name: Install summary (one line per step)
        if: always()
        shell: pwsh
        run: if (Test-Path D:\PO\install_log.txt) { Select-String -Path D:\PO\install_log.txt -Pattern '\[(OK|WARN|FAIL|SKIP)\]' | ForEach-Object { $_.Line } }
      - name: The server answers
        shell: pwsh
        run: |
          $r = Invoke-WebRequest http://127.0.0.1:5000/health -UseBasicParsing
          $r.Content
          if ($r.Content -notmatch '"status"') { exit 1 }
          Get-SmbShare PO_Archive | Format-List Name,Path
          $t = Get-ScheduledTask -TaskName 'PO Web Server (Boot)'
          $t.Principal | Format-List UserId, LogonType, RunLevel
          $owner = (Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'serve.py' } | ForEach-Object { (Invoke-CimMethod -InputObject $_ -MethodName GetOwner).User })
          "server process owner: $owner"
          if ("$owner" -notmatch 'posvc') { Write-Error 'the server does not run as the chosen Windows account'; exit 1 }
          if (Select-String -Path D:\PO\install_log.txt -Pattern 'Svc-Passw0rd-CI-7') { Write-Error 'the Windows password is in the log'; exit 1 }
          Get-Content D:\PO\app\config.ini
      - name: The host wrote the team file and the friendly name
        shell: pwsh
        run: |
          Get-Content D:\PO\client_import.json
          Get-Content C:\Windows\System32\drivers\etc\hosts | Select-String 'PO-SETUP'
          Get-NetFirewallRule -DisplayName 'PO Web*' | Format-Table DisplayName, Enabled, Profile
          if (-not (Select-String -Path C:\Windows\System32\drivers\etc\hosts -Pattern 'poweb.*PO-SETUP')) { exit 1 }
          if (-not (Test-Path D:\PO\client_import.json)) { exit 1 }
      - name: PROBE - purchase-order PDF (Edge headless) under the accounts a boot task can use
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory D:\probe -Force | Out-Null
          icacls D:\probe /grant '*S-1-1-0:(OI)(CI)F' | Out-Null
          @'
          import os, sys
          sys.path.insert(0, r"D:\PO\app"); os.chdir(r"D:\PO\app")
          import config, pdfgen
          out = sys.argv[1]; config.PDF_ARGS = sys.argv[2] if len(sys.argv) > 2 else ""
          try:
              pdfgen.html_to_pdf("<html dir='rtl'><body><h1>اختبار أمر شراء</h1></body></html>", out + ".pdf"); r = "OK %d bytes" % os.path.getsize(out + ".pdf")
          except Exception as e:
              r = "FAIL %s: %s" % (type(e).__name__, e)
          open(out, "w", encoding="utf-8").write(r + " | TEMP=" + os.environ.get("TEMP", "") + " | USER=" + os.environ.get("USERNAME", ""))
          '@ -replace '(?m)^          ', '' | Set-Content D:\probe\probe.py -Encoding UTF8
          $py = (Get-Content D:\PO\app\deploy\python_path.txt).Trim()
          function Probe($name, $user, $pw, $extra) {
            $out = "D:\probe\$name.txt"
            $arg = "D:\probe\probe.py `"$out`"" + $(if ($extra) { " `"$extra`"" } else { "" })
            $a = New-ScheduledTaskAction -Execute $py -Argument $arg -WorkingDirectory 'D:\PO\app'
            if ($user -eq 'SYSTEM') { Register-ScheduledTask -TaskName "probe-$name" -Action $a -Principal (New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest) -Force | Out-Null }
            else { Register-ScheduledTask -TaskName "probe-$name" -Action $a -User $user -Password $pw -RunLevel Limited -Force | Out-Null }
            Start-ScheduledTask -TaskName "probe-$name"
            foreach ($i in 1..70) { Start-Sleep -Seconds 2; if (Test-Path $out) { break } }
            "PROBE $name => " + $(if (Test-Path $out) { Get-Content $out -Encoding UTF8 } else { 'NO RESULT (LastTaskResult=' + (Get-ScheduledTaskInfo -TaskName "probe-$name").LastTaskResult + ')' })
            Unregister-ScheduledTask -TaskName "probe-$name" -Confirm:$false
          }
          Start-Transcript D:\probe\summary.log | Out-Null
          Probe 'system-plain' 'SYSTEM' '' ''
          Probe 'system-nosandbox' 'SYSTEM' '' '--no-sandbox'
          Probe 'account-plain' "$env:COMPUTERNAME\posvc" 'Svc-Passw0rd-CI-7' ''
          Probe 'account-nosandbox' "$env:COMPUTERNAME\posvc" 'Svc-Passw0rd-CI-7' '--no-sandbox'
          Stop-Transcript | Out-Null
      - name: A team PC (client mode, real) - connection test, friendly name, shortcut
        shell: pwsh
        run: |
          $env:PO_SHARE_PASSWORD = 'Svc-Passw0rd-CI-7'
          Get-Content D:\PO\client_import.json
          python installer\po_setup.py --role client --silent --import-file D:\PO\client_import.json --share-user posvc --map-drive P | Tee-Object D:\probe\client.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmdkey /list | Select-String -Pattern 'posvc' -Context 1,0
          if (-not (cmdkey /list | Select-String 'posvc')) { Write-Error 'the account was not saved in Credential Manager'; exit 1 }
          (net use | Out-String) | Set-Content D:\probe\drive.log
          "network drive P: present: $(Test-Path P:\)" | Add-Content D:\probe\drive.log
          Select-String -Path D:\probe\client.log -Pattern '.' -ErrorAction SilentlyContinue | Out-Null
          $desk = [Environment]::GetFolderPath('Desktop')
          Get-ChildItem $desk -Filter *.url | ForEach-Object { $_.FullName; Get-Content $_.FullName }
          if (-not (Get-ChildItem $desk -Filter *.url)) { Write-Error 'no shortcut'; exit 1 }
          python installer\po_setup.py --remove-lan
          if (Select-String -Path C:\Windows\System32\drivers\etc\hosts -Pattern 'PO-SETUP') { Write-Error 'hosts line not removed'; exit 1 }
          if (Get-NetFirewallRule -DisplayName 'PO Web*' -ErrorAction SilentlyContinue) { Write-Error 'rules not removed'; exit 1 }
          if (cmdkey /list | Select-String 'posvc') { Write-Error 'saved account not removed'; exit 1 }
      - name: Start at boot with nobody signed in (scheduled task as SYSTEM) - installs, really starts, answers, removes
        shell: pwsh
        run: |
          # stop the server the installer started, then let the TASK start it
          Stop-ScheduledTask -TaskName 'PO Web Server (Boot)' -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'serve.py' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep -Seconds 3
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\boot_task.ps1 -Root D:\PO\app
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = Get-ScheduledTask -TaskName 'PO Web Server (Boot)'
          $t.Principal | Format-List UserId, LogonType, RunLevel
          if ($t.Principal.UserId -ne 'SYSTEM') { Write-Error 'not SYSTEM'; exit 1 }
          Start-ScheduledTask -TaskName 'PO Web Server (Boot)'
          $ok = $false
          foreach ($i in 1..60) { Start-Sleep -Seconds 3; try { $r = Invoke-WebRequest http://127.0.0.1:5000/health -UseBasicParsing -TimeoutSec 3; if ($r.Content -match 'status') { $ok = $true; break } } catch {} }
          Get-ScheduledTaskInfo -TaskName 'PO Web Server (Boot)' | Format-List LastRunTime, LastTaskResult
          Get-Content D:\PO\app\logs\server.out.txt -Tail 20 -ErrorAction SilentlyContinue
          $owner = (Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'serve.py' } | ForEach-Object { (Invoke-CimMethod -InputObject $_ -MethodName GetOwner).User })
          "server process owner: $owner"
          Stop-ScheduledTask -TaskName 'PO Web Server (Boot)'
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'serve.py' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\boot_task.ps1 -Root D:\PO\app -Remove
          if (Get-ScheduledTask -TaskName 'PO Web Server (Boot)' -ErrorAction SilentlyContinue) { Write-Error 'task not removed'; exit 1 }
          if (-not $ok) { Write-Error 'server did not answer when started by the SYSTEM task'; exit 1 }
      - name: Full export, then a SECOND installation restored from the package (real) - same files, server answers
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'serve.py' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep -Seconds 3
          Remove-Item D:\PO\data\*.laccdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory D:\PO_Archive\ci-test -Force | Out-Null
          [IO.File]::WriteAllBytes('D:\PO_Archive\ci-test\ملف تجربة.pdf', [Text.Encoding]::ASCII.GetBytes("%PDF-1.4`n%%EOF"))
          python installer\po_setup.py --export --app D:\PO\app --dest D:\PO_Export
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $pkg = (Get-ChildItem D:\PO_Export\PO_Export_*.zip | Select-Object -First 1).FullName
          python installer\po_setup.py --verify-package $pkg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $zip = Get-ChildItem po_web_v*.zip | Sort-Object { [version](($_.BaseName -replace 'po_web_v','') -replace '_','.') } -Descending | Select-Object -First 1
          @{ share_folder='D:\PO2_Archive'; base='D:\PO2'; create_share=$false; db_mode='restore'; restore_package=$pkg; port=5055; install_tesseract=$false; open_firewall=$false;
             set_private=$false; alias_name=''; autostart=$false; start_after=$true; zip_path=$zip.FullName } | ConvertTo-Json | Out-File -Encoding utf8 answers2.json
          python installer\po_setup.py --silent --answers answers2.json
          if ($LASTEXITCODE -ne 0) { Get-Content D:\PO2\install_log.txt -Tail 60; exit 1 }
          Select-String -Path D:\PO2\install_log.txt -Pattern '\[(OK|WARN|FAIL|SKIP)\]' | ForEach-Object { $_.Line }
          $r = Invoke-WebRequest http://127.0.0.1:5055/health -UseBasicParsing
          if ($r.Content -notmatch '"status"') { exit 1 }
          if (-not (Test-Path 'D:\PO2_Archive\ci-test\ملف تجربة.pdf')) { Write-Error 'archive file not restored'; exit 1 }
          $a = (Get-ChildItem D:\PO_Archive -Recurse -File | Measure-Object).Count; $b = (Get-ChildItem D:\PO2_Archive -Recurse -File | Measure-Object).Count
          "archive files: old=$a new=$b"
          if ($b -lt $a) { Write-Error 'fewer files after restore'; exit 1 }
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'serve.py' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
      - name: Admin panel operations, for real (backup folders in config.ini, stop/start, full backup, add user, network, boot task)
        shell: pwsh
        run: |
          Remove-Item D:\PO\data\*.laccdb -ErrorAction SilentlyContinue
          python installer\po_setup.py --admin-test --app D:\PO\app --dest D:\PO_AdminTest
          $code = $LASTEXITCODE
          Get-Content D:\PO\app\config.ini
          Get-ChildItem D:\PO\app -Filter 'config.ini.bak_*' | Select-Object Name
          Stop-ScheduledTask -TaskName 'PO Web Server (Boot)' -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName 'PO Web Server (Boot)' -Confirm:$false -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -match 'serve.py' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          if ($code -ne 0) { Write-Error 'an admin-panel operation failed'; exit 1 }
      - name: Acceptance check on COPIES of the fresh installation (real Access engine)
        continue-on-error: true
        timeout-minutes: 12
        env:
          PYTHONUNBUFFERED: "1"
        shell: pwsh
        run: |
          New-Item -ItemType Directory D:\PO_TEST | Out-Null
          Copy-Item D:\PO\data\PurchaseSystem.accdb D:\PO_TEST\PurchaseSystem.accdb
          New-Item -ItemType Directory D:\PO_TEST\archive | Out-Null
          robocopy D:\PO_Archive D:\PO_TEST\archive /E /COPY:DAT /R:1 /W:1 /NFL /NDL /NP | Out-Null
          cd D:\PO\app
          .\po.bat tools\acceptance_check.py --db-copy D:\PO_TEST\PurchaseSystem.accdb --archive-copy D:\PO_TEST\archive --work D:\PO_TEST\work --full-hash
      - name: Acceptance report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path D:\PO_TEST\work\acceptance_report.md) { Get-Content D:\PO_TEST\work\acceptance_report.md }
      - name: Collect results inside the workspace
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory results -Force | Out-Null
          foreach ($f in 'D:\PO\install_log.txt','D:\PO_TEST\work\acceptance_report.md','D:\PO_TEST\work\acceptance_report.json') { if (Test-Path $f) { Copy-Item $f results\ } }
          if (Test-Path D:\PO\logs) { Copy-Item D:\PO\logs\*.txt results\ -ErrorAction SilentlyContinue }
          "===== SUMMARY ====="
          foreach ($f in 'D:\probe\summary.log','D:\probe\client.log','D:\probe\drive.log') { if (Test-Path $f) { Get-Content $f -Encoding UTF8 | Where-Object { $_ -match 'PROBE|✔|⚠|✘|P:|present|OK|error' } | Select-Object -First 14 } }
          "===== END ====="
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: results
          if-no-files-found: ignore
