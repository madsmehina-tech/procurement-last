<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تسجيل الدخول - إدارة العقود والمشتريات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E293B">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>إدارة العقود والمشتريات</h1>
      <p class="login-sub">Contracts &amp; Procurement Management · شركة الهضب للتجارة والمقاولات</p>
      {% include "_flashes.html" %}
      <form method="post">
        <label>اسم المستخدم</label>
        <input type="text" name="username" required autofocus>
        <label>كلمة المرور</label>
        <input type="password" name="password" required>
        <button class="btn btn-primary" type="submit">دخول</button>
      </form>
      <div class="login-or"><span>ليس لديك حساب؟</span></div>
      <a class="btn login-register" href="{{ url_for('register') }}">تسجيل مستخدم جديد</a>
    </div>
  </div>
</body>
</html>
