<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تسجيل الدخول - إدارة العقود والمشتريات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>إدارة العقود والمشتريات</h1>
      <p class="login-sub">Contracts &amp; Procurement Management · شركة الهضب للتجارة والمقاولات</p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
        {% endif %}
      {% endwith %}
      <form method="post">
        <label>اسم المستخدم</label>
        <input type="text" name="username" required autofocus>
        <label>كلمة المرور</label>
        <input type="password" name="password" required>
        <button class="btn btn-primary" type="submit">دخول</button>
      </form>
      <div class="login-or"><span>ليس لديك حساب؟</span></div>
      <a class="btn login-register" href="{{ url_for('register') }}">تسجيل مستخدم جديد</a>
    </div>
  </div>
</body>
</html>
