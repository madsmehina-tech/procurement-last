<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>{{ 'أمر صرف ' ~ order_no if orders|length == 1 else 'أوامر الصرف' }}</title>
<style>
  @page { size: A4; margin: 12mm; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #0F172A; margin: 0; font-size: 13px; }
  .po-sheet { page-break-after: always; padding-bottom: 8px; } .po-sheet:last-child { page-break-after: auto; }
  .bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1F3A5C; padding-bottom: 10px; }
  .bar h1 { margin: 0; font-size: 24px; color: #1F3A5C; } .bar small { color: #475569; display: block; margin-top: 4px; }
  .bar img { width: 54px; height: 54px; border-radius: 50%; }
  .no { color: #475569; line-height: 1.8; } .to { font-weight: 600; margin: 14px 0 4px; } .ask { line-height: 2; font-size: 14px; }
  table.kv { width: 100%; border-collapse: collapse; margin-top: 12px; background: #F8FAFC; }
  .kv td { border-bottom: 1px solid #E2E8F0; padding: 10px 12px; } .kv td:first-child { width: 22%; color: #64748B; }
  .sigs { display: flex; gap: 10px; margin-top: 30px; }
  .sig { flex: 1; text-align: center; } .sig b { display: block; font-size: 12.5px; } .sig i { display: block; height: 60px; border-bottom: 1px solid #0F172A; } .sig span { color: #64748B; font-size: 11.5px; }
  .toolbar { text-align: center; padding: 10px; } .toolbar button { font: inherit; padding: 8px 20px; }
  @media print { .toolbar { display: none; } }
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">طباعة / حفظ PDF</button></div>
{% for o in orders %}{% include "_payment_order.html" %}{% endfor %}
</body>
</html>
