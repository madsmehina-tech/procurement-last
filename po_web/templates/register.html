<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تسجيل مستخدم جديد - إدارة العقود والمشتريات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card" style="max-width:460px;">
      <h1>تسجيل مستخدم جديد</h1>
      <p class="login-sub">يُرسل طلبك إلى مدير النظام، ولا يُفعَّل حسابك إلا بعد موافقته</p>
      {% include "_flashes.html" %}
      <form method="post">
        <label>الاسم الكامل</label>
        <input type="text" name="full_name" value="{{ form.get('full_name', '') }}" required autofocus>
        <label>المسمى الوظيفي</label>
        <input type="text" name="job_title" value="{{ form.get('job_title', '') }}" placeholder="مثال: مهندس مشتريات">
        <label>البريد الإلكتروني (اختياري)</label>
        <input type="email" name="email" value="{{ form.get('email', '') }}" dir="ltr" style="text-align:right;">
        <label>اسم المستخدم (حروف إنجليزية وأرقام)</label>
        <input type="text" name="username" value="{{ form.get('username', '') }}" required dir="ltr" style="text-align:right;" autocomplete="off">
        <label>كلمة المرور (8 أحرف فأكثر، فيها حرف ورقم)</label>
        <input type="password" name="password" required autocomplete="new-password">
        <label>أعد كتابة كلمة المرور</label>
        <input type="password" name="password2" required autocomplete="new-password">
        <button class="btn btn-primary" type="submit">إرسال الطلب للمدير</button>
      </form>
      <div class="login-or"><span>لديك حساب؟</span></div>
      <a class="btn login-register" href="{{ url_for('login') }}">العودة لتسجيل الدخول</a>
    </div>
  </div>
</body>
</html>
