<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة مؤشرات مقاولي الباطن</title>
{% include "_exec_css.html" %}
{% include "_exec_extra_css.html" %}
<style>
  @page { size: A4 landscape; margin: 8mm 8mm 11mm; @bottom-center { content: "صفحة " counter(page) " من " counter(pages); font: 9px Tahoma, Arial, sans-serif; color: #64748B; } }
  * { box-sizing: border-box; } html, body { margin: 0; padding: 0; width: 100%; }
  body { font-family: "Segoe UI", Tahoma, "Cairo", Arial, sans-serif; font-size: 11.5px; letter-spacing: 0; background: #fff; }
  .toolbar { text-align: center; padding: 10px; } .toolbar button { font: inherit; padding: 8px 20px; } @media print { .toolbar { display: none; } }
  .top { display: flex; align-items: center; gap: 14px; padding-bottom: 8px; border-bottom: 2px solid #1B232E; margin-bottom: 12px; }
  .top img { height: 54px; width: auto; object-fit: contain; flex: none; } .mid { flex: 1; text-align: center; } .co { font-size: 12px; color: #475569; font-weight: 600; } .ttl { font-size: 19px; font-weight: 700; } .sub { color: #475569; } .meta { color: #334155; line-height: 1.7; white-space: nowrap; font-size: 11px; }
  .exec { padding: 0 !important; background: #fff !important; } .ex-card { box-shadow: none !important; transform: none !important; padding: 12px 14px !important; break-inside: avoid; } .ex-grid { gap: 10px; }
  .ex-kpi-val { font-size: 22px !important; } .vc { height: 150px; } .dn-ring { width: 120px; height: 120px; } .ex-head { margin-bottom: 8px; } .ex-title { font-size: 13.5px; }
  .ex-tbl { font-size: 11px; } .ex-tbl th, .ex-tbl td { padding: 5px 7px; } .ex-tbl tr { page-break-inside: avoid; } .ex-tbl thead { display: table-header-group; }
  .ex-c3 { grid-column: span 3 !important; } .ex-c6 { grid-column: span 6 !important; } .ex-c12 { grid-column: span 12 !important; }
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">طباعة / حفظ PDF</button></div>
<div class="top"><img src="{{ company_logo }}" alt="شعار الشركة"><div class="mid"><div class="co">شركة الهضب للتجارة والمقاولات</div><div class="ttl">لوحة مؤشرات مقاولي الباطن</div><div class="sub">{{ f.label or 'كل المقاولين والمشاريع' }}</div></div>
  <div class="meta">صدر في: <bdi dir="ltr">{{ now }}</bdi></div></div>
<div class="exec" id="exec" data-theme="light">{% include "_subs_dashboard_body.html" %}</div>
</body>
</html>
