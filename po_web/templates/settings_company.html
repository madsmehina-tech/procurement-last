{% extends "base.html" %}
{% set active = "settings_company" %}
{% block title %}بيانات الشركة{% endblock %}
{% block subtitle %}الطرف الأول في كل العقود والاتفاقيات: تُكتب هنا مرة واحدة{% endblock %}
{% block content %}
<form method="post" class="card" style="padding:22px 24px;max-width:860px;">
  <label class="set-lab" style="margin-top:0;">الاسم النظامي للشركة</label><input class="inp" name="legalname" required value="{{ c.get('LegalName') or '' }}">
  <div class="form-3"><div><label class="set-lab">السجل التجاري</label><input class="inp" name="cr" value="{{ c.get('CR') or '' }}"></div><div><label class="set-lab">الرقم الضريبي</label><input class="inp" name="vatno" value="{{ c.get('VatNo') or '' }}"></div>
    <div><label class="set-lab">الرقم الوطني الموحد</label><input class="inp" name="unifiedno" value="{{ c.get('UnifiedNo') or '' }}"></div></div>
  <div class="form-3"><div><label class="set-lab">المدينة (مكان توقيع العقد)</label><input class="inp" name="city" value="{{ c.get('City') or '' }}"></div><div><label class="set-lab">الهاتف</label><input class="inp" name="phone" value="{{ c.get('Phone') or '' }}" dir="ltr"></div>
    <div><label class="set-lab">البريد الإلكتروني</label><input class="inp" name="email" value="{{ c.get('Email') or '' }}" dir="ltr"></div></div>
  <label class="set-lab">العنوان</label><input class="inp" name="address" value="{{ c.get('Address') or '' }}">
  <div class="form-2"><div><label class="set-lab">ممثل الشركة (الموقِّع)</label><input class="inp" name="repname" value="{{ c.get('RepName') or '' }}"></div><div><label class="set-lab">صفته</label><input class="inp" name="reptitle" value="{{ c.get('RepTitle') or '' }}"></div></div>
  <div class="form-3"><div><label class="set-lab">البنك</label><input class="inp" name="bankname" value="{{ c.get('BankName') or '' }}"></div><div><label class="set-lab">الآيبان</label><input class="inp" name="iban" value="{{ c.get('IBAN') or '' }}" dir="ltr"></div>
    <div><label class="set-lab">اسم صاحب الحساب</label><input class="inp" name="accountholder" value="{{ c.get('AccountHolder') or '' }}"></div></div>
  <div style="margin-top:16px;"><button class="btn btn-primary btn-lg" type="submit">حفظ</button></div></form>
{% endblock %}
