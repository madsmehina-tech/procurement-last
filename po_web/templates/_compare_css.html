<style>
  .cp-steps{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .cp-step{flex:1;min-width:150px;padding:10px 14px;border-radius:12px;background:var(--surface,#fff);border:1px solid var(--border,#E5EAF0);font-size:13px;color:var(--text-secondary,#64748B);display:flex;gap:8px;align-items:center}
  .cp-step b{width:24px;height:24px;border-radius:50%;background:#E9EEF3;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
  .cp-step.done{color:#1A5E3C}.cp-step.done b{background:#DFF0E5}.cp-step.now{border-color:#29595e;color:#14323A;font-weight:700;box-shadow:0 0 0 2px rgba(41,89,94,.12)}.cp-step.now b{background:#29595e;color:#fff}
  .cp-panel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  @media(max-width:1100px){.cp-panel{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .cp-card{background:#fff;border:1px solid #E5EAF0;border-radius:14px;padding:14px 16px}.cp-card small{display:block;color:#64748B;font-size:12px}.cp-card .v{font-size:17px;font-weight:700;margin:4px 0;line-height:1.35}.cp-card .n{font-size:12.5px;color:#475569}
  .cp-card.star{border-color:#29595e;background:#F3F8F8}
  .cp-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px}
  .cp-offer{background:#fff;border:1px solid #E5EAF0;border-radius:14px;padding:14px 16px}.cp-offer h4{margin:0 0 6px;font-size:15px}.cp-offer .row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}.cp-offer .row b{font-variant-numeric:tabular-nums}
  .cp-bar{height:8px;border-radius:5px;background:#E9EEF3;overflow:hidden;margin:6px 0}.cp-bar i{display:block;height:100%;background:#29595e}.cp-bar.low i{background:#C0392B}
  .cp-flag{display:block;font-size:12px;color:#8A2A22;background:#FDEDEA;border-radius:6px;padding:3px 8px;margin-top:4px}
  .cp-win{border:2px solid #1A5E3C;background:#F2FAF5}
  .cp-wrap{overflow-x:auto;background:#fff;border:1px solid #E5EAF0;border-radius:14px}
  table.cp{border-collapse:collapse;width:100%;font-size:13px;min-width:880px}
  table.cp th{background:#14323A;color:#fff;padding:9px 8px;text-align:center;font-weight:700;border-left:1px solid rgba(255,255,255,.15);vertical-align:middle;line-height:1.35}
  table.cp td{padding:8px;border-bottom:1px solid #EEF1F5;border-left:1px solid #F1F4F8;vertical-align:middle;text-align:center}
  table.cp td.nm{text-align:right;font-weight:600;min-width:200px}table.cp td.nm small{display:block;font-weight:400;color:#64748B}
  table.cp td.hist{font-size:11.5px;color:#475569;min-width:150px;line-height:1.5}
  .cp-price{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}.cp-total{display:block;font-size:11.5px;color:#64748B;direction:ltr}
  td.low-cell{background:#E8F6EC;box-shadow:inset 0 0 0 2px #2E9E5B}
  td.miss{background:repeating-linear-gradient(135deg,#FFF1F0,#FFF1F0 8px,#FFE4E1 8px,#FFE4E1 16px);color:#B02A1E;font-weight:700;font-size:12.5px}
  td.miss small{display:block;font-weight:400;font-size:11px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}.d-low{background:#2E9E5B}.d-near{background:#E0A800}.d-high{background:#C0392B}.d-very-low{background:#7A4FC4}
  .pct{font-size:11.5px;direction:ltr;display:inline-block}.warn-i{display:block;font-size:11px;color:#9A6700}.review-i{display:block;font-size:11px;color:#7A4FC4}
  table.cp tfoot td{background:#F5F7FA;font-weight:700;border-top:2px solid #14323A}table.cp tfoot tr.adj td{background:#F3F8F8}
  .cp-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:#475569;margin:10px 2px}.cp-legend span{display:flex;align-items:center}
  .cp-box{background:#fff;border:1px solid #E5EAF0;border-radius:14px;padding:16px 18px;margin-bottom:14px}
  .cp-grp{border:1px solid #E5EAF0;border-radius:12px;margin-bottom:12px;background:#fff;overflow:hidden}.cp-grp-h{display:grid;grid-template-columns:1fr 130px 130px;gap:10px;padding:10px 14px;background:#F5F7FA;align-items:end}
  .cp-mem{display:grid;grid-template-columns:200px 1fr 90px 230px;gap:10px;padding:8px 14px;border-top:1px solid #EEF1F5;align-items:center;font-size:13px}
  .cp-mem.rv{background:#FBF7FF}.cp-conf{font-size:11.5px;color:#7A4FC4}
  .cp-ln{display:grid;grid-template-columns:34px 1fr 90px 100px 120px 120px 34px;gap:8px;align-items:center;margin-bottom:6px}.cp-ln.h{font-size:12px;color:#64748B}
</style>
